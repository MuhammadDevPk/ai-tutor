name: Supabase Keep-Alive Health Check

on:
  schedule:
    # Run every Sunday at 04:00 UTC to prevent Supabase 7-day inactivity pause
    - cron: '0 4 * * 0'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Supabase PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - name: Supabase Keep-Alive Ping
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          if [ -z "$SUPABASE_DATABASE_URL" ]; then
            echo "NOTICE: SUPABASE_DATABASE_URL secret is not configured in repository settings."
            echo "Skipping keep-alive ping. Workflow completed with exit code 0."
            exit 0
          fi

          echo "Pinging Supabase database to maintain active status..."
          python3 -m pip install --quiet --no-cache-dir "psycopg[binary]>=3.1.0"
          python3 -c "
          import os, sys, psycopg
          url = os.environ['SUPABASE_DATABASE_URL']
          try:
              with psycopg.connect(url, connect_timeout=15) as conn:
                  with conn.cursor() as cur:
                      cur.execute('SELECT 1;')
                      res = cur.fetchone()
                      print(f'Keep-alive query succeeded: {res}')
          except Exception as e:
              print(f'Error connecting to Supabase: {e}', file=sys.stderr)
              sys.exit(1)
          "
          echo "Supabase keep-alive ping completed successfully."
