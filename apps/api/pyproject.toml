[project]
name = "api"
version = "0.1.0"
description = "AI Video Tutor API Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "argon2-cffi>=23.1.0",
    "fastapi>=0.115.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg-pool>=3.2.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.10.0",
    "pyjwt>=2.10.0",
    "pymupdf4llm>=2.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.18",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".venv",
    "alembic",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "^alembic/",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration",
]
