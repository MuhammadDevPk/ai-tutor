name: Full Verification Suite (Including Slow Tests)

on:
  push:
    branches: ["main", "phase-*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  verify-full:
    name: Full Suite & Slow Tests Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: ai_tutor
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PostgreSQL extensions
        run: |
          PGPASSWORD=localdev psql -h localhost -U postgres -d ai_tutor -c "CREATE EXTENSION IF NOT EXISTS vector;"
          PGPASSWORD=localdev psql -h localhost -U postgres -d ai_tutor -c "CREATE EXTENSION IF NOT EXISTS ltree;"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9"

      - name: Install Frontend Dependencies
        run: |
          cd apps/web && pnpm install --frozen-lockfile

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://postgres:localdev@localhost:5432/ai_tutor
        run: |
          cd apps/api && uv run alembic upgrade head

      - name: Run Full verify.sh Gate (Fast & Full Checks)
        env:
          DATABASE_URL: postgresql://postgres:localdev@localhost:5432/ai_tutor
        run: |
          chmod +x scripts/verify.sh scripts/check-bundle-secrets.sh
          ./scripts/verify.sh --full

      - name: Run Slow Model-Dependent Tests (FastEmbed & Offline Weights)
        env:
          DATABASE_URL: postgresql://postgres:localdev@localhost:5432/ai_tutor
        run: |
          echo "Running slow tests (FastEmbed download and embedding tests) on GitHub runner..."
          cd apps/api && uv run pytest -v -m 'slow' --tb=short
